<form id="postForm" enctype="multipart/form-data">
    <div>
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required placeholder="Enter post title">
    </div>

    <div>
        <label for="body">Body</label>
        <textarea id="body" name="body" required placeholder="What would you like to share?"></textarea>
    </div>

    <div>
        <label for="attachment">Attachment (Image/File)</label>
        <input type="file" id="attachment" name="attachment" accept="image/*">
    </div>

    <button type="submit">Publish Post</button>
</form>
